# ===================================================================
# VitalPulse Emergency Blood Network - Spring Boot Application Properties
# Development Environment: In-Memory H2 Database
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# In-Memory H2 Database Configuration
# -------------------------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive as long as the JVM is running
# MODE=MySQL allows compatibility with standard MySQL functions and SQL syntax
spring.datasource.url=jdbc:h2:mem:vitalpulse_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# H2 Web Console Configuration
# Accessible in browser at: http://localhost:8080/h2-console
# JDBC URL to enter in console: jdbc:h2:mem:vitalpulse_db
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# -------------------------------------------------------------------
# JPA / Hibernate & Schema Initialization
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures schema.sql and data.sql are executed on startup to initialize tables and seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000

# -------------------------------------------------------------------
# Mail Configuration (Optional mock/development SMTP)
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=alerts@vitalpulse.org
spring.mail.password=mock-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
